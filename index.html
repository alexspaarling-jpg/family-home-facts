  "😳 This is actually real:",

  "🐙 The universe has some explaining to do:",
  "📢 Tell someone this immediately:",
  "✨ Weird but wonderful:",
  "🏆 Congratulations! You know this now:"
];

let deck = [];
for (const [emoji, category, fact] of facts) {
  for (const intro of intros) {
    deck.push({emoji, category, text: intro + "<br>" + fact});
  }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
shuffle(deck);

let index = 0;
const stickyColors = ["#fff7a8","#ffd9e8","#d9f5ff","#dff7d8","#eadcff","#ffe2bd"];

function setStickyColor(){
  document.getElementById("app").style.background =
    stickyColors[Math.floor(Math.random()*stickyColors.length)];
}

function showFact(){
  const item = deck[index];
  setStickyColor();
  document.getElementById("emoji").textContent = item.emoji;
  document.getElementById("label").textContent = item.category;
  document.getElementById("fact").innerHTML = item.text;
  index++;
  if(index >= deck.length){ shuffle(deck); index=0; }
}
showFact();
setInterval(showFact, 15*60*1000);
